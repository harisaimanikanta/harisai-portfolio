  <body class="bg-white text-black antialiased selection:bg-black selection:text-white overflow-x-hidden font-sans">
    <!-- Direct High-Fidelity Audio Stream (Clean, No Ads) -->
    <audio id="bg-soundtrack" autoplay loop preload="auto" playsinline webkit-playsinline>
      <source src="./audio/bg-music.mp3" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>

    <script>
      (function() {
        var audio = document.getElementById('bg-soundtrack');
        if (!audio) return;
        audio.volume = 0.85;

        function startAudio() {
          if (audio.paused) {
            audio.play().catch(function() {});
          }
        }

        // Try direct playback on millisecond 0
        startAudio();

        // Any touch, click, pointer or keydown starts playback immediately
        var events = ['touchstart', 'touchend', 'pointerdown', 'pointerup', 'click', 'keydown'];
        function onInteract() {
          startAudio();
          if (!audio.paused) {
            events.forEach(function(e) {
              document.removeEventListener(e, onInteract, true);
              window.removeEventListener(e, onInteract, true);
            });
          }
        }
        events.forEach(function(e) {
          document.addEventListener(e, onInteract, { capture: true, passive: true });
          window.addEventListener(e, onInteract, { capture: true, passive: true });
        });
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
